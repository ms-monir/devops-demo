services:
  app:
    image: ghcr.io/ms-monir/devops-demo:latest
    container_name: devops-compose

    ports:
      - "8082:5000"

    environment:
      FLASK_MESSAGE: ${FLASK_MESSAGE}

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    restart: unless-stopped